<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel do Colaborador</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
    }

    /* Barra lateral */
    .sidebar {
      width: 220px;
      background-color: #1e1e1e;
      display: flex;
      flex-direction: column;
      padding-top: 20px;
      box-shadow: 2px 0 6px rgba(0,0,0,0.5);
    }

    .sidebar button {
      padding: 12px 20px;
      background: none;
      border: none;
      color: #fff;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }

    .sidebar button:hover {
      background-color: #00d084;
      color: #121212;
      font-weight: bold;
    }

    /* Área principal */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1e1e1e;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.5);
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      color: #00d084;
    }

    header button {
      padding: 8px 16px;
      background-color: #e74c3c;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    header button:hover {
      background-color: #c0392b;
    }

    /* Container do conteúdo (iframe ocupa tudo) */
    #conteudo {
      flex: 1;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    #frameConteudo {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <button onclick="carregarPagina('usuarios/')">Usuários</button>
    <button onclick="carregarPagina('pagamentos.html')">Pagamentos</button>
    <button onclick="carregarPagina('relatorios.html')">Relatórios</button>
    <button onclick="carregarPagina('configuracoes.html')">Configurações</button>
    <button onclick="carregarPagina('notificacoes.html')">Notificações</button>
    <button onclick="carregarPagina('acesso-adm.html')">Acesso ADM</button>
  </div>

  <div class="main-content">
    <header>
      <h1>Painel do Colaborador</h1>
      <button onclick="logout()">Sair</button>
    </header>

    <div id="conteudo">
      <iframe id="frameConteudo" src=""></iframe>
    </div>
  </div>

  <script>
    // Pega o e-mail do usuário logado
    const userEmail = sessionStorage.getItem("usuarioLogado");
    if (!userEmail) {
      window.location.href = "painel/";
    }

    function logout() {
      sessionStorage.removeItem("usuarioLogado");
      window.location.href = "/";
    }

    // Função para carregar páginas no iframe
    function carregarPagina(pagina) {
      document.getElementById('frameConteudo').src = pagina;
    }
  </script>
</body>
</html>
