<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel do Colaborador</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #121212;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    header {
      background-color: #1e1e1e;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.5);
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      color: #00d084;
    }

    header button {
      padding: 8px 16px;
      background-color: #e74c3c;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    header button:hover {
      background-color: #c0392b;
    }

    main {
      flex: 1;
      padding: 20px;
    }

    .card {
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.5);
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
      color: #00d084;
    }
  </style>
</head>
<body>
  <header>
    <h1>Painel do Colaborador</h1>
    <button onclick="logout()">Sair</button>
  </header>

  <main>
    <div class="card">
      <h2>Bem-vindo!</h2>
      <p id="userEmail">Você está logado como: <strong></strong></p>
    </div>

    <div class="card">
      <h2>Informações da Ferramenta</h2>
      <p>Aqui você pode visualizar dados internos, relatórios, resultados de trades, ou qualquer outra função que vamos integrar depois.</p>
    </div>
  </main>

  <script>
    // pega o e-mail do usuário logado (armazenado no login)
    const userEmail = sessionStorage.getItem("usuarioLogado");
    if (!userEmail) {
      window.location.href = "index.html"; // se não tiver login válido, volta pra tela inicial
    } else {
      document.querySelector("#userEmail strong").textContent = userEmail;
    }

    function logout() {
      sessionStorage.removeItem("usuarioLogado");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
