<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel do Colaborador</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
    }

    /* Barra lateral */
    .sidebar {
      width: 220px;
      background-color: #1e1e1e;
      display: flex;
      flex-direction: column;
      padding-top: 20px;
      box-shadow: 2px 0 6px rgba(0,0,0,0.5);
    }

    .sidebar button {
      padding: 12px 20px;
      background: none;
      border: none;
      color: #fff;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }

    .sidebar button:hover {
      background-color: #00d084;
      color: #121212;
      font-weight: bold;
    }

    /* Área principal */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1e1e1e;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.5);
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      color: #00d084;
    }

    header button {
      padding: 8px 16px;
      background-color: #e74c3c;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    header button:hover {
      background-color: #c0392b;
    }

    /* Container do conteúdo dinâmico */
    #conteudo {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .card {
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.5);
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
      color: #00d084;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <button onclick="carregarPagina('usuarios.html')">Usuários</button>
    <button onclick="carregarPagina('pagamentos.html')">Pagamentos</button>
    <button onclick="carregarPagina('relatorios.html')">Relatórios</button>
    <button onclick="carregarPagina('configuracoes.html')">Configurações</button>
    <button onclick="carregarPagina('notificacoes.html')">Notificações</button>
    <button onclick="carregarPagina('acesso-adm.html')">Acesso ADM</button>
  </div>

  <div class="main-content">
    <header>
      <h1>Painel do Colaborador</h1>
      <button onclick="logout()">Sair</button>
    </header>

    <div id="conteudo">
      <div class="card">
        <h2>Bem-vindo!</h2>
        <p id="userEmail">Você está logado como: <strong></strong></p>
      </div>

      <div class="card">
        <h2>Informações da Ferramenta</h2>
        <p>Aqui você pode visualizar dados internos, relatórios, resultados de trades, ou qualquer outra função que vamos integrar depois.</p>
      </div>
    </div>
  </div>

  <script>
    // Pega o e-mail do usuário logado
    const userEmail = sessionStorage.getItem("usuarioLogado");
    if (!userEmail) {
      window.location.href = "index.html";
    } else {
      document.querySelector("#userEmail strong").textContent = userEmail;
    }

    function logout() {
      sessionStorage.removeItem("usuarioLogado");
      window.location.href = "index.html";
    }

  // Função para carregar conteúdo dinâmico de forma genérica
function carregarPagina(pagina) {
  fetch(pagina)
    .then(response => response.text())
    .then(html => {
      const container = document.getElementById('conteudo');
      container.innerHTML = html;

      // Tenta descobrir o nome da função init dinamicamente
      const nomeArquivo = pagina.split("/").pop().split(".")[0]; // ex: usuarios.html -> usuarios
      const funcInit = `init${nomeArquivo.charAt(0).toUpperCase() + nomeArquivo.slice(1)}`;

      if (typeof window[funcInit] === "function") {
        window[funcInit]();
      } else {
        console.log(`Nenhuma função de inicialização (${funcInit}) encontrada.`);
      }
    })
    .catch(err => {
      document.getElementById('conteudo').innerHTML = `<p>Erro ao carregar a página: ${err}</p>`;
    });
}
    
  </script>
</body>
</html>
