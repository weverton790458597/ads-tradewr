<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Usuários - TradeWR</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #1e1e1e;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .painel-container {
      width: 100%;
      max-width: 800px;
      background-color: #2c2c2c;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    h2 {
      color: #81c784;
      text-align: center;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #444;
      text-align: left;
    }

    th {
      background-color: #3a3a3a;
    }

    .mensagem {
      margin: 15px 0;
      text-align: center;
      color: #81c784;
      font-size: 14px;
    }

    .erro {
      color: red;
    }

    @media (max-width: 600px) {
      th, td {
        padding: 8px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="painel-container">
    <h2>Painel de Usuários</h2>
    <div class="mensagem" id="status">Carregando usuários...</div>
    <table id="tabelaUsuarios">
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
        </tr>
      </thead>
      <tbody>
        <!-- Linhas vão ser preenchidas dinamicamente -->
      </tbody>
    </table>
  </div>

  <script>
    const tabela = document.getElementById('tabelaUsuarios').querySelector('tbody');
    const status = document.getElementById('status');

    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyfi4t5y5yb7ETOj0NcjS_RMTMgguKLYXZ21gyxAfUFpgsHI2Z7RLUI8G0aoESjN3s8/exec?action=listar"; // Coloque seu URL correto aqui

    async function carregarUsuarios() {
      status.textContent = 'Carregando usuários...';
      try {
        const res = await fetch(SHEET_API_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (data.success && Array.isArray(data.usuarios)) {
          tabela.innerHTML = ''; // Limpa tabela
          if (data.usuarios.length === 0) {
            status.textContent = 'Nenhum usuário cadastrado.';
            return;
          }

          data.usuarios.forEach(usuario => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${usuario.nome}</td><td>${usuario.email}</td>`;
            tabela.appendChild(tr);
          });
          status.textContent = ''; // Remove mensagem de carregando
        } else {
          status.textContent = data.message || 'Erro ao carregar usuários.';
          status.classList.add('erro');
        }
      } catch (err) {
        console.error(err);
        status.textContent = 'Erro ao conectar com a planilha. Verifique publicação e URL.';
        status.classList.add('erro');
      }
    }

    window.addEventListener('DOMContentLoaded', carregarUsuarios);
  </script>
</body>
</html>
