<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Usuários da Extensão</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #00d084;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table, th, td {
      border: 1px solid #444;
    }
    th, td {
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #1e1e1e;
    }
    tr:nth-child(even) {
      background-color: #1a1a1a;
    }
    input, button {
      padding: 8px;
      margin: 5px 0;
      border-radius: 6px;
      border: none;
    }
    input {
      width: 200px;
    }
    button {
      background-color: #00d084;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #00b06a;
    }
  </style>
</head>
<body>

<h1>Usuários da Extensão</h1>

<div>
  <h3>Adicionar Novo Usuário</h3>
  <input type="text" id="nome" placeholder="Nome">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="senha" placeholder="Senha">
  <button onclick="adicionarUsuario()">Adicionar</button>
</div>

<table>
  <thead>
    <tr>
      <th>Nome</th>
      <th>Email</th>
      <th>Senha</th>
      <th>Data Cadastro</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="tabelaUsuarios">
    <!-- Usuários serão listados aqui -->
  </tbody>
</table>

<script>
  // Função para buscar usuários do JSON
  async function carregarUsuarios() {
    try {
      const response = await fetch('usuarios-extensao.json');
      const data = await response.json();
      const tabela = document.getElementById('tabelaUsuarios');
      tabela.innerHTML = '';

      data.usuariosExtensao.forEach(usuario => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${usuario.nome}</td>
          <td>${usuario.email}</td>
          <td>${usuario.senha}</td>
          <td>${usuario.dataCadastro}</td>
          <td>${usuario.status}</td>
        `;
        tabela.appendChild(row);
      });
    } catch (err) {
      console.error('Erro ao carregar usuários:', err);
    }
  }

  // Função para adicionar usuário
  function adicionarUsuario() {
    const nome = document.getElementById('nome').value;
    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;

    if (!nome || !email || !senha) {
      alert('Preencha todos os campos!');
      return;
    }

    const novoUsuario = {
      nome: nome,
      email: email,
      senha: senha,
      dataCadastro: new Date().toISOString().split('T')[0],
      status: 'ativo',
      plano: 'inicial'
    };

    // Aqui precisamos salvar no JSON (no backend ou via Node.js)
    // No momento, só exibiremos no front-end
    const tabela = document.getElementById('tabelaUsuarios');
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${novoUsuario.nome}</td>
      <td>${novoUsuario.email}</td>
      <td>${novoUsuario.senha}</td>
      <td>${novoUsuario.dataCadastro}</td>
      <td>${novoUsuario.status}</td>
    `;
    tabela.appendChild(row);

    // Limpa os campos
    document.getElementById('nome').value = '';
    document.getElementById('email').value = '';
    document.getElementById('senha').value = '';
  }

  // Carrega os usuários ao abrir a página
  carregarUsuarios();
</script>

</body>
</html>
