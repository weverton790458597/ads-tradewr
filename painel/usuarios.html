<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Usuários - TradeWR</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 250px;
      background-color: #1e1e1e;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      color: #fff;
      background-color: #00d084;
    }

    .sidebar button:hover {
      background-color: #00a361;
    }

    .content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    table th, table td {
      padding: 10px;
      border-bottom: 1px solid #333;
      text-align: left;
    }

    table th {
      background-color: #00d084;
      color: #121212;
    }

    tbody tr:nth-child(even) {
      background-color: #1a1a1a;
    }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      color: #00d084;
      font-size: 16px;
    }

    #novoUsuarioForm {
      display: none;
      margin-bottom: 20px;
    }

    #novoUsuarioForm input {
      padding: 8px;
      margin-right: 10px;
      border-radius: 6px;
      border: none;
      width: calc(100% - 20px);
      margin-bottom: 10px;
    }

    #novoUsuarioForm button {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background-color: #00d084;
      color: #fff;
      cursor: pointer;
    }

    #novoUsuarioForm button:hover {
      background-color: #00a361;
    }

    .panel-detalhes {
      display: none;
      background-color: #1e1e1e;
      padding: 10px;
      border-radius: 6px;
      margin-top: 5px;
    }

    .panel-detalhes input {
      margin-right: 10px;
      margin-bottom: 5px;
      padding: 5px;
      border-radius: 4px;
      border: none;
    }

    #refreshBtn {
      background: none;
      border: none;
      cursor: pointer;
      color: #00d084;
      font-size: 20px;
      margin-bottom: 10px;
    }

    #urlScript {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      margin-bottom: 10px;
      color: #121212;
    }

    .senha-mascarada {
      letter-spacing: 3px;
    }

    @media (max-width: 600px) {
      .sidebar { width: 200px; }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <button onclick="toggleForm()">Adicionar Novo Usuário</button>
  </div>

  <div class="content">
    <h3>URL do Apps Script</h3>
    <input type="text" id="urlScript" placeholder="Cole o URL do Web App aqui">

    <div id="novoUsuarioForm">
      <input type="text" id="nomeUsuario" placeholder="Nome">
      <input type="email" id="emailUsuario" placeholder="Email">
      <input type="password" id="senhaUsuario" placeholder="Senha">
      <button onclick="adicionarUsuario()">Adicionar</button>
    </div>

    <h2>Lista de Usuários</h2>
    <button id="refreshBtn" onclick="carregarUsuarios()" title="Atualizar">&#10227;</button>

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Email</th>
          <th>Senha</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="usuariosTabela"></tbody>
    </table>
  </div>

  <script>
    function getURL() {
      const url = document.getElementById('urlScript').value.trim();
      if (!url) { alert("https://script.google.com/macros/s/AKfycbyiV0c9Q44f4e_ucOQ69uB6sxKhYadhFuCdxOEnLrHZJ1dRfotf2WnS41jDwIiPmj422g/exec"); return null; }
      return url;
    }

    function toggleForm() {
      const form = document.getElementById('novoUsuarioForm');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    function adicionarUsuario() {
      const url = getURL();
      if (!url) return;

      const nome = document.getElementById('nomeUsuario').value.trim();
      const email = document.getElementById('emailUsuario').value.trim();
      const senha = document.getElementById('senhaUsuario').value.trim();

      if (!nome || !email || !senha) {
        alert("Preencha todos os campos!");
        return;
      }

      const formData = new URLSearchParams();
      formData.append('nome', nome);
      formData.append('email', email);
      formData.append('senha', senha);

      fetch(url, { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert("Usuário adicionado com sucesso!");
            document.getElementById('nomeUsuario').value = '';
            document.getElementById('emailUsuario').value = '';
            document.getElementById('senhaUsuario').value = '';
            carregarUsuarios();
          } else {
            alert(data.message || "Erro ao adicionar usuário!");
          }
        })
        .catch(err => console.error(err));
    }

    function carregarUsuarios() {
      const url = getURL();
      if (!url) return;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById('usuariosTabela');
          tbody.innerHTML = '';

          if (!data.usuarios) return;

          data.usuarios.forEach((usuario, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${usuario.nome}</td>
              <td>${usuario.email}</td>
              <td>
                <span class="senha-mascarada">&#8226;&#8226;&#8226;&#8226;&#8226;</span>
                <button class="btn-icon" onclick="revelarSenha('${usuario.email}')">&#128065;</button>
              </td>
              <td>
                <select onchange="atualizarStatus('${usuario.email}', this.value)">
                  <option value="Ativo" ${usuario.status==='Ativo'?'selected':''}>Ativo</option>
                  <option value="Desativado" ${usuario.status==='Desativado'?'selected':''}>Desativado</option>
                </select>
              </td>
              <td>
                <button class="btn-icon" onclick="toggleDetalhes(${index})">&#9998;</button>
              </td>
            `;
            tbody.appendChild(tr);

            const detalhesTr = document.createElement('tr');
            const detalhesTd = document.createElement('td');
            detalhesTd.colSpan = 5;
            detalhesTd.innerHTML = `
              <div class="panel-detalhes" id="detalhes-${index}">
                <label>Vencimento: <input type="date" value="${usuario.vencimento || ''}"></label>
                <label>Observações: <input type="text" value="${usuario.observacoes || ''}"></label>
                <label>Data Cadastro: <input type="date" value="${usuario.dataCadastro || ''}" disabled></label>
                <button onclick="salvarDetalhes('${usuario.email}', ${index})">Salvar</button>
              </div>
            `;
            detalhesTr.appendChild(detalhesTd);
            tbody.appendChild(detalhesTr);
          });
        })
        .catch(err => console.error(err));
    }

    function revelarSenha(email) {
      const nova = prompt("Digite a senha de autenticação para revelar:");
      if (nova === "123456") alert("Aqui você poderia mostrar a senha real!");
      else alert("Senha incorreta!");
    }

    function toggleDetalhes(index) {
      const panel = document.getElementById(`detalhes-${index}`);
      panel.style.display = panel.style.display==='none'?'block':'none';
    }

    function salvarDetalhes(email, index) {
      const panel = document.getElementById(`detalhes-${index}`);
      const inputs = panel.querySelectorAll("input");
      const data = {
        vencimento: inputs[0].value,
        observacoes: inputs[1].value
      };
      console.log("Salvar detalhes de", email, data);
      alert("Detalhes salvos (teste)!");
      // Aqui você faria fetch POST/PUT para atualizar no Apps Script
    }

    function atualizarStatus(email, status) {
      console.log("Atualizar status de", email, status);
      // Aqui você faria fetch POST/PUT para atualizar no Apps Script
    }
  </script>
</body>
</html>
