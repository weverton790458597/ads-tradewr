<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Usuários</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
    button { margin-right: 5px; cursor: pointer; }
    .senha { font-family: monospace; }
  </style>
</head>
<body>
  <h2>Gerenciamento de Usuários</h2>
  <table id="usuariosTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Email</th>
        <th>Senha</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbzWUEKcJFD-WrxKs2YAvN_kQpj_hZAXOLrD008lkbuztO114-2HZlNoKonk3qakZsXlRg/exec?action=listar"; 
    const ADMIN_PASSWORD = "1234"; // senha mestra pra ver as senhas

    async function carregarUsuarios() {
      try {
        const res = await fetch(`${API_ENDPOINT}?action=listar`);
        const data = await res.json();

        if (!data.success) {
          alert("Erro ao carregar usuários");
          return;
        }

        const usuarios = data.usuarios;
        const tbody = document.querySelector("#usuariosTable tbody");
        tbody.innerHTML = "";

        usuarios.forEach(user => {
          const tr = document.createElement("tr");

          tr.innerHTML += `<td>${user.id || ""}</td>`;
          tr.innerHTML += `<td>${user.nome || ""}</td>`;
          tr.innerHTML += `<td>${user.email || ""}</td>`;

          // Senha mascarada + olhinho
          tr.innerHTML += `
            <td class="senha">
              <span id="senha-${user.id}">••••••••</span>
              <button onclick="verSenha('${user.id}', '${user.senha}')">👁️</button>
            </td>`;

          tr.innerHTML += `<td>${user.status || "active"}</td>`;

          tr.innerHTML += `
            <td>
              <button onclick="editarUsuario('${user.email}')">✏️ Editar</button>
              <button onclick="deletarUsuario('${user.email}')">🗑️ Deletar</button>
              <button onclick="toggleUsuario('${user.email}')">
                ${user.status === "blocked" ? "✅ Desbloquear" : "⛔ Bloquear"}
              </button>
            </td>
          `;

          tbody.appendChild(tr);
        });
      } catch (err) {
        alert("Erro na conexão com o servidor");
        console.error(err);
      }
    }

    function verSenha(id, senha) {
      const input = prompt("Digite a senha de administrador:");
      if (input === ADMIN_PASSWORD) {
        document.getElementById(`senha-${id}`).textContent = senha;
      } else {
        alert("Senha incorreta!");
      }
    }

    async function editarUsuario(email) {
      const novoNome = prompt("Novo nome (deixe vazio pra não alterar):");
      const novaSenha = prompt("Nova senha (deixe vazio pra não alterar):");
      const res = await fetch(`${API_ENDPOINT}?action=atualizar&email=${encodeURIComponent(email)}&nome=${encodeURIComponent(novoNome)}&senha=${encodeURIComponent(novaSenha)}`, { method: "POST" });
      const result = await res.json();
      alert(result.message);
      carregarUsuarios();
    }

    async function deletarUsuario(email) {
      if (!confirm("Tem certeza que deseja deletar este usuário?")) return;
      const res = await fetch(`${API_ENDPOINT}?action=deletar&email=${encodeURIComponent(email)}`, { method: "POST" });
      const result = await res.json();
      alert(result.message);
      carregarUsuarios();
    }

    async function toggleUsuario(email) {
      const res = await fetch(`${API_ENDPOINT}?action=toggle&email=${encodeURIComponent(email)}`, { method: "POST" });
      const result = await res.json();
      alert("Novo status: " + result.status);
      carregarUsuarios();
    }

    // Carrega os usuários assim que a página abrir
    carregarUsuarios();
  </script>
</body>
</html>
