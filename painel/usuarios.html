<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Usuários</title>
  <style>
    body {
      margin: 0;
      display: flex;
      font-family: Arial, sans-serif;
      height: 100vh;
      background-color: #121212;
      color: #fff;
    }

    .sidebar {
      width: 250px;
      background-color: #1e1e1e;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar button {
      padding: 10px;
      background-color: #00d084;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }

    .sidebar button:hover {
      background-color: #00a361;
    }

    .content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table th, table td {
      padding: 10px;
      border-bottom: 1px solid #333;
      text-align: left;
    }

    table th {
      background-color: #00d084;
      color: #121212;
    }

    #novoUsuarioForm {
      display: none;
      margin-bottom: 20px;
    }

    #novoUsuarioForm input {
      padding: 8px;
      margin-right: 10px;
      border-radius: 6px;
      border: none;
    }

    #novoUsuarioForm button {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background-color: #00d084;
      color: #fff;
      cursor: pointer;
    }

    #novoUsuarioForm button:hover {
      background-color: #00a361;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <button onclick="mostrarFormulario()">Adicionar Novo Usuário</button>
    <button onclick="gerarLink()">Gerar Link</button>
    <button onclick="carregarUsuarios()">Atualizar Lista</button>
  </div>

  <div class="content">
    <div id="novoUsuarioForm">
      <input type="email" id="emailUsuario" placeholder="Email">
      <input type="password" id="senhaUsuario" placeholder="Senha">
      <button onclick="adicionarUsuario()">Adicionar</button>
    </div>

    <h2>Lista de Usuários</h2>
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Senha</th>
        </tr>
      </thead>
      <tbody id="usuariosTabela"></tbody>
    </table>
  </div>

  <script>
    const URL = "http://localhost:3000/usuarios";

    function mostrarFormulario() {
      const form = document.getElementById("novoUsuarioForm");
      form.style.display = form.style.display === "none" ? "block" : "none";
    }

    function adicionarUsuario() {
      const email = document.getElementById("emailUsuario").value;
      const senha = document.getElementById("senhaUsuario").value;

      if (!email || !senha) {
        alert("Preencha todos os campos!");
        return;
      }

      fetch(URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, senha })
      })
      .then(res => res.json())
      .then(data => {
        if (data.sucesso) {
          alert("Usuário adicionado!");
          document.getElementById("emailUsuario").value = "";
          document.getElementById("senhaUsuario").value = "";
          carregarUsuarios();
        }
      })
      .catch(err => console.error(err));
    }

    function carregarUsuarios() {
      fetch(URL)
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById("usuariosTabela");
          tbody.innerHTML = "";
          data.usuarios.forEach(usuario => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${usuario.email}</td><td>${usuario.senha}</td>`;
            tbody.appendChild(tr);
          });
        })
        .catch(err => console.error(err));
    }

    function gerarLink() {
  fetch("/gerar-link")
    .then(res => res.json())
    .then(data => {
      const linkArea = document.getElementById("linkGerado");
      linkArea.textContent = data.link;

      // Seleciona automaticamente o link para copiar
      const range = document.createRange();
      range.selectNode(linkArea);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);

      try {
        document.execCommand('copy');
        alert("Link gerado e copiado para a área de transferência!");
      } catch (err) {
        alert("Link gerado! Copie manualmente: " + data.link);
      }

      window.getSelection().removeAllRanges();
    })
    .catch(err => {
      console.error(err);
      alert("Erro ao gerar link.");
    });
}


    // Carrega a lista quando a página abre
    carregarUsuarios();
  </script>

</body>
</html>
