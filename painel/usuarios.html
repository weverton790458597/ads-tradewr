<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>Test Fetch - Raw</title>
</head>
<body>
  <h2>Teste CRU - Buscar usuários (troque a URL abaixo)</h2>

  <!-- 1) Cole aqui o URL do seu Apps Script (sem ?action se quiser, ou com ?action=listar) -->
  <div>
    <label for="url">Apps Script URL:</label><br/>
    <input id="url" style="width:90%" value="https://script.google.com/macros/s/AKfycbyfi4t5y5yb7ETOj0NcjS_RMTMgguKLYXZ21gyxAfUFpgsHI2Z7RLUI8G0aoESjN3s8/exec?action=listar"/>
  </div>

  <div style="margin-top:10px;">
    <button id="btn">Buscar dados (fetch)</button>
    <button id="btnFetchNoCache">Buscar sem cache</button>
  </div>

  <h3>Status</h3>
  <div id="status">Aguardando ação...</div>

  <h3>JSON bruto recebido</h3>
  <pre id="raw" style="background:#111;color:#bada55;padding:10px;max-height:300px;overflow:auto;"></pre>

  <h3>Render simples (linhas)</h3>
  <div id="list"></div>

  <script>
    const btn = document.getElementById('btn');
    const btnNoCache = document.getElementById('btnFetchNoCache');
    const raw = document.getElementById('raw');
    const status = document.getElementById('status');
    const inputUrl = document.getElementById('url');
    const list = document.getElementById('list');

    async function doFetch(noCache=false) {
      const url = inputUrl.value.trim();
      if (!url) { status.textContent = 'Coloque a URL do Apps Script primeiro.'; return; }

      status.textContent = 'Fetching...';
      raw.textContent = '';
      list.innerHTML = '';

      try {
        const fetchUrl = noCache ? (url + (url.includes('?') ? '&' : '?') + '_=' + Date.now()) : url;
        console.log('Fetching URL:', fetchUrl);

        const res = await fetch(fetchUrl, { method: 'GET', cache: 'no-store' });
        console.log('fetch ok, status', res.status);

        const txt = await res.text();
        // mostra texto cru sempre
        raw.textContent = txt;

        // tenta parsear JSON
        let data;
        try { data = JSON.parse(txt); }
        catch(parseErr) {
          console.error('Erro parse JSON:', parseErr);
          status.textContent = 'Recebido mas não é JSON válido (ver raw).';
          return;
        }

        // se veio success e usuarios, renderiza simples
        if ((data.success === true || data.success === "true") && Array.isArray(data.usuarios)) {
          status.textContent = 'Recebido JSON com data.usuarios — renderizando...';
          // montar lista simples
          const ul = document.createElement('div');
          ul.innerHTML = '<b>Total:</b> ' + data.usuarios.length + '<br/>';
          data.usuarios.forEach((u, i) => {
            // mostra todas as chaves de cada usuário
            const div = document.createElement('div');
            div.style = 'padding:6px;border-bottom:1px solid #333;';
            let content = '<b>#' + (i+1) + '</b> ';
            for (const k in u) {
              content += `${k}: ${u[k]} &nbsp; `;
            }
            div.innerHTML = content;
            ul.appendChild(div);
          });
          list.appendChild(ul);
        } else {
          status.textContent = 'JSON recebido, mas formato inesperado. Veja raw para detalhes.';
          console.log('Objeto recebido:', data);
        }

      } catch (err) {
        console.error('Erro no fetch:', err);
        status.textContent = 'Erro no fetch — veja console (F12) para detalhes. Possível CORS / URL errada / deploy não público.';
        raw.textContent = String(err);
      }
    }

    btn.addEventListener('click', () => doFetch(false));
    btnNoCache.addEventListener('click', () => doFetch(true));
  </script>
</body>
</html>
