<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Usuários - TradeWR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e1e;
      color: #fff;
      padding: 20px;
    }
    h2 {
      margin-bottom: 20px;
      color: #81c784;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #444;
    }
    th {
      background-color: #2c2c2c;
    }
    td input {
      width: 100%;
      padding: 5px;
      border: none;
      border-radius: 4px;
      background-color: #3a3a3a;
      color: #fff;
    }
    td input:focus {
      outline: 2px solid #81c784;
    }
    button {
      padding: 10px 20px;
      background-color: #4caf50;
      border: none;
      border-radius: 4px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background-color: #81c784; }
    .mensagem {
      margin-top: 10px;
      font-size: 14px;
      text-align: center;
      min-height: 18px;
    }
    @media (max-width: 600px) {
      th, td { font-size: 12px; padding: 6px; }
      button { padding: 8px 12px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <h2>Painel de Usuários</h2>

  <table id="usuariosTable">
    <thead>
      <tr>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Senha</th>
        <th>Salvar</th>
      </tr>
    </thead>
    <tbody>
      <!-- Usuários serão injetados aqui via JS -->
    </tbody>
  </table>

  <div class="mensagem" id="mensagem"></div>

  <script>
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbz2D7tsVCMULhWXBEb4up9vMoZjbuUa_EZCV8WykLifXCdx7I_8z69I1beKKrFECMLQ7w/exec"; // Substitua pelo seu Apps Script
    const tableBody = document.querySelector('#usuariosTable tbody');
    const mensagem = document.getElementById('mensagem');

    // Função para carregar usuários
    async function carregarUsuarios() {
      try {
        const res = await fetch(SHEET_API_URL + "?acao=listar");
        const data = await res.json();

        if (!data.success) {
          mensagem.style.color = 'red';
          mensagem.textContent = data.message || "Erro ao carregar usuários";
          return;
        }

        tableBody.innerHTML = ""; // limpa tabela

        data.usuarios.forEach((user, index) => {
          const tr = document.createElement('tr');

          // Nome
          const nomeTd = document.createElement('td');
          const nomeInput = document.createElement('input');
          nomeInput.value = user.nome || "";
          nomeTd.appendChild(nomeInput);
          tr.appendChild(nomeTd);

          // E-mail
          const emailTd = document.createElement('td');
          const emailInput = document.createElement('input');
          emailInput.value = user.email || "";
          emailTd.appendChild(emailInput);
          tr.appendChild(emailTd);

          // Senha
          const senhaTd = document.createElement('td');
          const senhaInput = document.createElement('input');
          senhaInput.value = user.senha || "";
          senhaTd.appendChild(senhaInput);
          tr.appendChild(senhaTd);

          // Botão Salvar
          const salvarTd = document.createElement('td');
          const salvarBtn = document.createElement('button');
          salvarBtn.textContent = 'Salvar';
          salvarBtn.addEventListener('click', () => salvarUsuario(index, nomeInput.value, emailInput.value, senhaInput.value));
          salvarTd.appendChild(salvarBtn);
          tr.appendChild(salvarTd);

          tableBody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
        mensagem.style.color = 'red';
        mensagem.textContent = 'Erro ao carregar usuários';
      }
    }

    // Função para salvar alterações de um usuário
    async function salvarUsuario(index, nome, email, senha) {
      try {
        const formData = new URLSearchParams();
        formData.append('acao', 'atualizar');
        formData.append('index', index); // índice do usuário na planilha
        formData.append('nome', nome);
        formData.append('email', email);
        formData.append('senha', senha);

        const res = await fetch(SHEET_API_URL, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (data.success) {
          mensagem.style.color = '#81c784';
          mensagem.textContent = 'Alterações salvas!';
        } else {
          mensagem.style.color = 'red';
          mensagem.textContent = data.message || 'Erro ao salvar alterações';
        }
      } catch (err) {
        console.error(err);
        mensagem.style.color = 'red';
        mensagem.textContent = 'Erro ao salvar alterações';
      }
    }

    // Carrega usuários ao abrir a página
    carregarUsuarios();
  </script>
</body>
</html>
