<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Usuários - TradeWR</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #1e1e1e;
    color: #fff;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: #81c784;
    margin-bottom: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
  }
  th, td {
    padding: 10px;
    border: 1px solid #444;
    text-align: left;
  }
  th { background-color: #2c2c2c; }
  td { background-color: #3a3a3a; }
  input {
    width: 100%;
    padding: 6px;
    border: none;
    border-radius: 4px;
    background-color: #555;
    color: #fff;
  }
  button {
    padding: 6px 12px;
    margin: 2px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-update { background-color: #4caf50; color: #000; }
  .btn-update:hover { background-color: #81c784; }
  .mensagem {
    text-align: center;
    margin-bottom: 20px;
    font-size: 14px;
    min-height: 18px;
  }
  @media (max-width: 600px) {
    table, th, td, input, button {
      font-size: 12px;
    }
  }
</style>
</head>
<body>

<h1>Painel de Usuários</h1>
<div class="mensagem" id="mensagem"></div>

<table>
  <thead>
    <tr>
      <th>Nome</th>
      <th>E-mail</th>
      <th>Senha</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody id="usuariosBody">
    <!-- Usuários serão listados aqui -->
  </tbody>
</table>

<script>
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzeeIfxc4oFL8or30iz94_ATIvfxMgDUt24C2B9OuYWFn8TIowZ_JnC6JP8pSMGrslh5w/exec"; // seu URL
const mensagem = document.getElementById('mensagem');
const usuariosBody = document.getElementById('usuariosBody');

// Função para listar usuários
function listarUsuarios() {
  fetch(`${SHEET_API_URL}?action=listar`)
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        usuariosBody.innerHTML = '';
        data.usuarios.forEach(usuario => {
          const tr = document.createElement('tr');

          tr.innerHTML = `
            <td><input type="text" value="${usuario.nome}" /></td>
            <td>${usuario.email}</td>
            <td><input type="password" placeholder="Nova senha" /></td>
            <td><button class="btn-update">Atualizar</button></td>
          `;

          const btnUpdate = tr.querySelector('.btn-update');
          const inputNome = tr.querySelector('td:nth-child(1) input');
          const inputSenha = tr.querySelector('td:nth-child(3) input');

          btnUpdate.addEventListener('click', () => {
            atualizarUsuario(usuario.email, inputNome.value.trim(), inputSenha.value.trim());
          });

          usuariosBody.appendChild(tr);
        });
      } else {
        mensagem.style.color = 'red';
        mensagem.textContent = 'Erro ao listar usuários';
      }
    })
    .catch(err => {
      console.error(err);
      mensagem.style.color = 'red';
      mensagem.textContent = 'Erro ao listar usuários';
    });
}

// Função para atualizar usuário
function atualizarUsuario(email, novoNome, novaSenha) {
  const formData = new URLSearchParams();
  formData.append('action', 'atualizar');
  formData.append('email', email);
  if(novoNome) formData.append('nome', novoNome);
  if(novaSenha) formData.append('senha', novaSenha);

  fetch(SHEET_API_URL, {
    method: 'POST',
    body: formData
  })
  .then(res => res.json())
  .then(data => {
    mensagem.style.color = data.success ? '#81c784' : 'red';
    mensagem.textContent = data.message;
    listarUsuarios(); // Atualiza lista
  })
  .catch(err => {
    console.error(err);
    mensagem.style.color = 'red';
    mensagem.textContent = 'Erro ao atualizar usuário';
  });
}

// Inicializa
listarUsuarios();
</script>

</body>
</html>
