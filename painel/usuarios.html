<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste Usuários - TradeWR</title>
</head>
<body>
  <h2>Usuários cadastrados:</h2>
  <pre id="jsonOutput">Carregando...</pre>

  <script>
    const output = document.getElementById('jsonOutput');

    // Coloque aqui o link do seu Web App do Apps Script
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyfi4t5y5yb7ETOj0NcjS_RMTMgguKLYXZ21gyxAfUFpgsHI2Z7RLUI8G0aoESjN3s8/exec?action=listar";

    fetch(SHEET_API_URL)
      .then(res => res.json())
      .then(data => {
        // Exibe o JSON bruto na tela
        output.textContent = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        output.textContent = "Erro ao buscar dados:\n" + err;
        console.error(err);
      });
  </script>
</body>
</html>
