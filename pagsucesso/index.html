<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Confirmado - TradeWR</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #1e3c72, #2a5298);
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      text-align: center;
      background: rgba(0,0,0,0.6);
      padding: 40px;
      border-radius: 15px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    img.logo {
      width: 100px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }
    .status {
      font-weight: bold;
      font-size: 1.5rem;
    }
    .btn {
      display: inline-block;
      padding: 12px 25px;
      font-size: 1rem;
      color: #fff;
      background: #28a745;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      transition: 0.3s;
    }
    .btn:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo.png" class="logo" alt="TradeWR Logo">
    <h1>Pagamento em Processamento</h1>
    <p class="status">Verificando o status do seu pagamento...</p>
    <a href="/" class="btn" id="homeBtn" style="display:none;">Voltar para o site</a>
  </div>

  <script>
    // Função para pegar query string
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    const paymentId = getQueryParam('payment_id');
    const statusText = document.querySelector('.status');
    const homeBtn = document.getElementById('homeBtn');

    if (!paymentId) {
      statusText.textContent = "ID de pagamento não fornecido!";
    } else {
      // Chamada ao Apps Script para verificar pagamento
      const url = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec';
      
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'verificar_pagamento', payment_id: paymentId })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success && data.status === 'approved') {
          statusText.textContent = "Parabéns! Seu pagamento foi aprovado.";
        } else {
          statusText.textContent = "Pagamento não confirmado ainda. Aguarde alguns minutos.";
        }
        homeBtn.style.display = 'inline-block';
      })
      .catch(err => {
        console.error(err);
        statusText.textContent = "Erro ao verificar pagamento. Tente novamente mais tarde.";
        homeBtn.style.display = 'inline-block';
      });
    }
  </script>
</body>
</html>
