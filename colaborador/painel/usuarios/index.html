<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Painel de Usuários</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
    input { width: 120px; }
    button { padding: 6px 10px; cursor: pointer; margin-right: 6px; }
    .atrasado { background-color: #ffd6d6; }
    .pago { background-color: #d6ffd6; }
  </style>
</head>
<body>
  <h1>Painel de Usuários</h1>

  <table id="usuariosTable">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Status</th>
        <th>Mensalidade</th>
        <th>Ativo</th>
        <th>Data do último pagamento</th>
        <th>Próximo vencimento</th>
        <th>Situação financeira</th>
        <th>Receita acumulada</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    // Só a URL base do Web App (sem ?action)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjMzZbs4aimguiD9LgsGI8Wa4fODvClqnoFnFOvPQ3LoIsGZidavFQv3lRJFDa0NlQbQ/exec";

    function sanitizeId(email) {
      return (email || "").replace(/[@.]/g, "_");
    }

    async function carregarUsuarios() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=listarPainel`);
        if (!res.ok) throw new Error("GET listarpainel falhou: " + res.status);
        const data = await res.json();
        const tbody = document.querySelector("#usuariosTable tbody");
        tbody.innerHTML = "";

        data.usuarios.forEach(u => {
          const idSafe = sanitizeId(u.Email || "");
          const tr = document.createElement("tr");
          tr.className = (u["Situação financeira"] === "Atrasado") ? "atrasado" : "pago";
          tr.innerHTML = `
            <td>${u.Nome || ""}</td>
            <td>${u.Email || ""}</td>
            <td><input type="text" value="${u.Status || ""}" id="status-${idSafe}"></td>
            <td><input type="number" value="${u.Mensalidade || 0}" id="mensalidade-${idSafe}"></td>
            <td>${u.Ativo || "Não"}</td>
            <td><input type="date" value="${u["Data do último pagamento"] || ""}" id="ultimo-${idSafe}"></td>
            <td>${u["Próximo vencimento"] || ""}</td>
            <td>${u["Situação financeira"] || ""}</td>
            <td>${u["Receita acumulada"] || 0}</td>
            <td>
              <button onclick="toggleAtivo('${u.Email}')">Ativar/Desativar</button>
              <button onclick="atualizarUsuario('${u.Email}')">Salvar</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("carregarUsuarios erro:", err);
        alert("Erro ao carregar usuários: " + err.message);
      }
    }

    // POST via form-urlencoded (URLSearchParams) — evita preflight CORS
    async function toggleAtivo(email) {
      try {
        const params = new URLSearchParams();
        params.append("action", "toggleAtivo");
        params.append("email", email);

        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: params // browser define content-type automaticamente
        });

        if (!res.ok) throw new Error("Resposta não OK: " + res.status);
        const data = await res.json();
        if (!data.success) throw new Error(data.message || "Erro no servidor");
        alert(`Novo status: ${data.novoValor}`);
        carregarUsuarios();
      } catch (err) {
        console.error("toggleAtivo erro:", err);
        alert("Erro ao atualizar status: " + (err.message || err));
      }
    }

    async function atualizarUsuario(email) {
      try {
        const idSafe = sanitizeId(email);
        const status = (document.getElementById(`status-${idSafe}`) || {}).value || "";
        const mensalidade = parseFloat((document.getElementById(`mensalidade-${idSafe}`) || {}).value) || 0;
        const ultimo = (document.getElementById(`ultimo-${idSafe}`) || {}).value || "";

        const params = new URLSearchParams();
        params.append("action", "updatePainel");
        params.append("email", email);
        params.append("Status", status);
        params.append("Mensalidade", mensalidade.toString());
        params.append("Data do último pagamento", ultimo);

        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: params
        });

        if (!res.ok) throw new Error("Resposta não OK: " + res.status);
        const data = await res.json();
        if (!data.success) throw new Error(data.message || "Erro no servidor");
        alert(data.message || "Atualizado");
        carregarUsuarios();
      } catch (err) {
        console.error("atualizarUsuario erro:", err);
        alert("Erro ao salvar usuário: " + (err.message || err));
      }
    }

    // auto init
    carregarUsuarios();
  </script>
</body>
</html>
