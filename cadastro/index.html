<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - TradeWR</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logocadastro.png">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1e1e1e;
      padding: 10px;
    }

    .cadastro-container {
      width: 100%;
      max-width: 400px;
      background-color: #2c2c2c;
      padding: 30px 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      text-align: center;
      color: #fff;
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      background-image: url('logocadastro.png'); /* Substitua pela sua logo */
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    h2 {
      margin-bottom: 25px;
      color: #81c784;
      font-size: 22px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      background-color: #3a3a3a;
      color: #fff;
    }

    input::placeholder {
      color: #ccc;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      background-color: #4caf50;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #000;
      transition: 0.3s;
    }

    button:hover {
      background-color: #81c784;
    }

    .mensagem {
      margin-top: 15px;
      font-size: 14px;
      min-height: 18px;
    }

    @media (max-width: 500px) {
      .cadastro-container {
        padding: 20px 15px;
      }

      h2 {
        font-size: 20px;
      }

      input {
        padding: 10px;
        font-size: 13px;
      }

      button {
        padding: 12px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="cadastro-container">
    <div class="logo"></div>
    <h2>Cadastro - TradeWR</h2>

    <input type="text" id="nome" placeholder="Digite seu nome">
    <input type="email" id="email" placeholder="Digite seu e-mail">
    <input type="password" id="senha" placeholder="Crie uma senha">

    <button id="cadastrar">Cadastrar</button>

    <div class="mensagem" id="mensagem"></div>
  </div>

  <script>
    const nomeInput = document.getElementById('nome');
    const emailInput = document.getElementById('email');
    const senhaInput = document.getElementById('senha');
    const cadastrarBtn = document.getElementById('cadastrar');
    const mensagem = document.getElementById('mensagem');

    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyiV0c9Q44f4e_ucOQ69uB6sxKhYadhFuCdxOEnLrHZJ1dRfotf2WnS41jDwIiPmj422g/exec";

    cadastrarBtn.addEventListener('click', () => {
      const nome = nomeInput.value.trim();
      const email = emailInput.value.trim();
      const senha = senhaInput.value.trim();
      mensagem.textContent = '';

      if (!nome || !email || !senha) {
        mensagem.style.color = 'red';
        mensagem.textContent = 'Preencha todos os campos!';
        return;
      }

      const formData = new URLSearchParams();
      formData.append('nome', nome);
      formData.append('email', email);
      formData.append('senha', senha);

      fetch(SHEET_API_URL, {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          mensagem.style.color = '#81c784';
          mensagem.textContent = 'Cadastro realizado com sucesso!';
          nomeInput.value = '';
          emailInput.value = '';
          senhaInput.value = '';
        } else {
          mensagem.style.color = 'red';
          mensagem.textContent = data.message || 'Erro ao cadastrar';
        }
      })
      .catch(err => {
        console.error('Erro:', err);
        mensagem.style.color = 'red';
        mensagem.textContent = 'Erro ao cadastrar';
      });
    });
  </script>
</body>
</html>
